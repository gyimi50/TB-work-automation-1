<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<h1>Reports</h1>

<a href="/" class="btn" style="display:inline-block; margin-bottom:32px; text-decoration:none; padding: 10px 24px;">← Vissza</a>

<div class="reports-list">
    <div th:each="report, iterStat : ${reports}"
         th:classappend="${iterStat.odd} ? 'report-card-odd' : 'report-card-even'"
         class="report-card">

        <div class="report-header">
            <span th:text="${report.matchDate}"></span>
            <span th:text="${report.matchCode}"></span>
            <span th:text="${report.teamHome}"></span>
            <span th:text="${report.teamAway}"></span>
        </div>

        <div class="report-texts">
            <div th:if="${report.report1}" class="report-text" th:text="${report.report1}"></div>
            <div th:if="${report.report2}" class="report-text" th:text="${report.report2}"></div>
            <div th:if="${report.report3}" class="report-text" th:text="${report.report3}"></div>
            <div th:if="${report.report4}" class="report-text" th:text="${report.report4}"></div>
        </div>

        <div class="report-actions">
            <form method="post" action="/reports/skip">
                <input type="hidden" name="id" th:value="${report.id}">
                <button class="btn btn-ignore" type="submit">Skip</button>
            </form>
            <button class="btn btn-disciplinary" type="button">Fegyelmit indít</button>
            <button class="btn btn-register" type="button"
                    th:data-id="${report.id}">Regisztráció</button>
        </div>

        <div class="register-form" th:id="'register-' + ${report.id}" style="display:none;">
            <form method="post" action="/reports/register">
                <input type="hidden" name="id" th:value="${report.id}">
                <input class="input-field" type="text" name="playerName" placeholder="Játékos neve">
                <input class="input-field" type="text" name="team" placeholder="Csapat">
                <input class="input-field" type="text" name="notes" placeholder="Megjegyzés">
                <button class="btn" type="submit">Submit</button>
            </form>
        </div>

    </div>
</div>

<script>
    document.querySelectorAll('.btn-register').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const form = document.getElementById('register-' + id);
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        });
    });
</script>
</body>
</html>
