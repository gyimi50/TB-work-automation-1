<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Case Handler</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<h1>Case Handler</h1>

<nav class="top-nav">
    <form method="post" action="/run-input">
        <button class="btn btn-nav" type="submit">Input Flow</button>
    </form>
    <form method="post" action="/run-output">
        <button class="btn btn-nav" type="submit">Output Flow</button>
    </form>
    <form method="post" action="/run-full">
        <button class="btn btn-nav" type="submit">Full Flow</button>
    </form>
    <form method="post" action="/run-reports">
        <button class="btn btn-nav" type="submit">Reports Flow</button>
    </form>
    <a href="/reports" class="btn btn-nav">Report Overview</a>
    <form method="post" action="/run-writeback">
        <button class="btn btn-nav" type="submit">Write Back</button>
    </form>
    <form method="post" action="/import-personal-records">
        <button class="btn btn-nav" type="submit">Import</button>
    </form>
</nav>

<p class="status" th:text="${status}"></p>

<div class="case-buttons" th:if="${not #lists.isEmpty(cases)}">
    <h2>BBCode másolása</h2>
    <div class="case-row" th:each="case : ${cases}">
        <button class="btn btn-case"
                th:text="${case.matchCode}"
                th:data-bbcode="${case.bbcodeContent}"
                onclick="copyBbcode(this)">
        </button>
        <button class="btn btn-title"
                th:data-title="${titles[case.id]}"
                onclick="copyTitle(this)">
            Header
        </button>
    </div>
</div>

<script>
    function copyBbcode(btn) {
    const content = btn.getAttribute('data-bbcode');
    navigator.clipboard.writeText(content);
    btn.classList.toggle('clicked');
}

function copyTitle(btn) {
    const content = btn.getAttribute('data-title');
    navigator.clipboard.writeText(content);
    btn.classList.toggle('clicked');
}
</script>
</body>
</html>
