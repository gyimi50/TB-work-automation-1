<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personal Records</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<h1>Personal Records</h1>

<a href="/" class="btn" style="display:inline-block; margin-bottom:32px; text-decoration:none; padding: 10px 24px;">← Vissza</a>

<div class="records-table">
    <div th:each="record : ${records}" class="record-row">
        <div class="record-info">
            <span class="record-player" th:text="${record.playerName}"></span>
            <span class="record-meta" th:text="${record.matchDate + ' · ' + record.matchCode}"></span>
            <span class="record-teams" th:text="${record.teams}"></span>
            <span class="record-team" th:text="${record.team != null ? record.team : '—'}"></span>
        </div>
        <div class="record-actions">
            <form method="post" action="/personal-records/update-team">
                <input type="hidden" name="id" th:value="${record.id}">
                <button class="btn btn-case" type="submit" name="team"
                        th:value="${teamSplits[record.id][0]}"
                        th:text="${teamSplits[record.id][0]}"></button>
                <button class="btn btn-case" type="submit" name="team"
                        th:value="${teamSplits[record.id][1]}"
                        th:text="${teamSplits[record.id][1]}"></button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
